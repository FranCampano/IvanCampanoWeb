server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sirve archivos existentes normalmente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Evita que Nginx haga rewrite en .well-known (útil para certificados, devtools, etc.)
    location ^~ /.well-known/ {
        allow all;
    }

    # Logs opcionales
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
